        output_type: array[string]
        parallel_nums: 3
        selected: false
        startNodeType: custom-iteration-start
        start_node_id: iter_start
        title: 逐 Block 抽取
        type: iteration
        width: 1020
      height: 250
      id: iteration
      position:
        x: 930
        y: 200
      positionAbsolute:
        x: 930
        y: 200
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom-iteration
      width: 1020
      zIndex: 1
    - data:
        desc: ''
        isInIteration: true
        selected: false
        title: ''
        type: iteration-start
      draggable: false
      height: 48
      id: iter_start
      parentId: iteration
      position:
        x: 24
        y: 100
      positionAbsolute:
        x: 954
        y: 300
      selectable: false
      sourcePosition: right
      targetPosition: left
      type: custom-iteration-start
      width: 44
      zIndex: 1002
    - data:
        code: "# -*- coding: utf-8 -*-\n\"\"\"Dify Code 节点 2（Iteration 内）：把当前 Block 对象拆成提示词需要的字符串。\n\nLLM 节点的提示词模板只能插入标量，所以这里先把 object 展开。\n\n输入：block（iteration 的 item）\n输出：department / work_section / delivery_group / raw_text / block_index\n\"\"\"\n\n\ndef main(block: dict) -> dict:\n    block = block or {}\n    return {\n        \"department\": block.get(\"department\") or \"（未标注）\",\n        \"work_section\": block.get(\"work_section\") or \"（未标注）\",\n        \"delivery_group\": block.get(\"delivery_group\") or \"（未标注）\",\n        \"raw_text\": block.get(\"raw_text\") or \"\",\n        \"block_index\": int(block.get(\"index\") or 0),\n    }\n"
        code_language: python3
        desc: ''
        outputs:
          department:
            children: null
            type: string
          work_section:
            children: null
            type: string
          delivery_group:
            children: null
            type: string
          raw_text:
            children: null
            type: string
          block_index:
            children: null
            type: number
        selected: false
        title: 展开 Block 字段
        type: code
        variables:
        - value_selector:
          - iteration
          - item
          variable: block
        isInIteration: true
        iteration_id: iteration
      height: 66
      id: block_fields
      position:
        x: 110
        y: 80
      positionAbsolute:
        x: 1040
        y: 280
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
      parentId: iteration
      extent: parent
      zIndex: 1001
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: 只产出 evidence_text，不猜字符位置
        isInIteration: true
        iteration_id: iteration
        model:
          completion_params:
            temperature: 0
            max_tokens: 4096
          mode: chat
          name: Qwen3.5-9B
          provider: langgenius/openai_api_compatible/openai_api_compatible
        prompt_template:
        - id: sys
          role: system
          text: "你是会议纪要业务事项抽取器。输入是一份会议材料中的一个结构 Block，\n你要从中抽出**业务事项（Item）**。只输出 JSON，不要解释、不要 Markdown。\n\n## 输出格式\n\n```json\n{\"items\":[{\n  \"department\": \"字符串或null\",\n  \"work_section\": \"字符串或null\",\n  \"delivery_group\": \"字符串或null\",\n  \"project\": \"字符串或null\",\n  \"item_type\": \"PROJECT_TASK|RESEARCH_TASK|NON_PROJECT_WORK|NON_TASK_ITEM\",\n  \"assignee\": [],\n  \"title\": \"字符串\",\n  \"content\": \"字符串\",\n  \"evidence_text\": \"逐字复制的原文片段\"\n}]}\n```\n\n只允许这 9 个键。禁止输出 confidence、priority、project_id、task_id、\nreasoning、merge_group、CREATE、UPDATE 等任何其他字段。\n\n## 你的唯一职责\n\n高召回、忠实地把这个 Block 拆成结构化业务事项。你**不做**以下任何一件事：\n不访问历史任务、不判断 CREATE/UPDATE、不做跨会议匹配、不做项目别名归一、\n不做跨 Item 语义合并、不做部门分发。\n\n## 粒度规则（最重要）\n\n一个 Item = **一个具有一致业务目标的业务事项**，既不是一句话，也不是一个项目名。\n\n- 若原文的多个动作明显服务于**同一个交付物 / 同一件事**（例如\"数据中心建设\"下的\n  顶面线管安装、吊顶施工、空调设备到货），合成**一个** Item，content 完整保留各动作。\n- 同一段里出现**多个不同项目**（例如 CRM 二期项目、数据中台项目、煤矿复合灾害\n  监测预警系统项目），必须拆成**多个** Item，绝不合并。\n- 原文用 ①②③ 或\"一是…二是…三是…\"分列时，各条通常面向**不同的子系统或不同的\n  交付物**（例如\"集控中心\"\"数据中心\"\"采场全景系统\"\"数据管理平台\"）。\n  这种情况下**每一条各自成为一个 Item**。\n- **严禁把原文分属不同编号、不同子系统的动作两两拼凑成一个 Item。**\n  把\"现场跟进\"和\"智能综合管控平台\"合成一条，是本任务中最严重的错误。\n- **拿不准是否属于同一业务事项时，一律拆开。** 后续 M3/M6 负责项目解析和任务关联；\n  错误合并无法挽回，拆多了可以修复。\n\n## 字段规则\n\n**department / work_section / delivery_group**\n优先用下面给出的 Block 上下文；Block 内部另有更具体的归属时以原文为准；确实没有则 null。\n\n**project**\n必须**逐字保留原文中出现的项目名称**。原文写\"红沙泉项目\"就输出\"红沙泉项目\"，\n即使你认为它可能是\"红沙泉二矿项目\"，也**禁止**改写、补全或归一。\n同一文档里\"红沙泉项目\"和\"红沙泉二矿项目\"是两个不同的值，分别照抄。\n本 Item 没有明确项目归属时填 null，不要臆造。\n\nproject 的值必须是**原文里出现过的一段连续文字**。特别注意三条：\n\n1. **不要把上级单位名和项目名拼起来。**\n   原文 `4.天地奔牛一是ERP 项目：…二是SCM 项目：…`\n   → project 是 `ERP 项目` 和 `SCM 项目`，\n   **不是** `天地奔牛ERP项目`、`天地奔牛SCM项目`。\n   单位名属于 `delivery_group`，不属于 `project`。\n2. **不要给原文没有\"项目\"二字的名称硬加后缀。**\n   原文 `针对小纪汗34 条专家意见，完成初设文件的全面修改`\n   → 这里没有项目名，project 填 `null`，**不是** `小纪汗项目`。\n3. 原文项目名里带空格就保留空格（如 `ERP 项目`），不要自行删改。\n\n项目称谓解析属于 M3 的职责，在 M1 里一律视为错误。\n\n**item_type**（与 project 是两个独立维度，禁止用 project 是否为空推导类型）\n- `PROJECT_TASK`：明确属于某个真实项目的业务任务。\n  Block 上下文（交付组、项目行）已经给出项目归属时，该 Item 就是 PROJECT_TASK，\n  **不要**因为动作本身听起来像日常事务（运维、沟通、汇报、报表）就降级成\n  NON_PROJECT_WORK——判据是\"有没有项目归属\"，不是\"动作重不重要\"。\n- `RESEARCH_TASK`：科研、研发研究、课题、技术研究类业务任务。\n  project 为空**不能**单独作为判定依据，有项目的科研任务同样是 RESEARCH_TASK。\n  work_section 是\"科研工作\"\"科研项目推进\"这类板块，或内容涉及课题、专利申报、\n  技术交底、研发研究、科研管理制度、科研例会时，判 RESEARCH_TASK，\n  **不要**因为没有项目名就退回 NON_PROJECT_WORK。\n- `NON_PROJECT_WORK`：需要实际执行、但没有具体真实项目归属的业务工作\n  （如参加展会、接待客户、日常沟通、内部管理事务）。\n- `NON_TASK_ITEM`：不构成实际任务。例如\"暂无\"、\"无工作安排\"、纯栏目标题、\n  纯背景说明、没有有效行动内容的信息。\n  注意 `{\"project\":\"武家塔项目\",\"item_type\":\"NON_TASK_ITEM\",\"content\":\"暂无。\"}`\n  是**合法**结果——有项目名不代表有任务。\n\n**assignee**\n始终是数组。只填原文括号中明确出现的人名（如\"（李军中）\"→ `[\"李军中\"]`，\n\"（李伟/邹超）\"→ `[\"李伟\",\"邹超\"]`）。没有明确人名时填 `[]`，**绝不**填 null，\n**绝不**把部门名、单位名、厂商名当作负责人。\n\n**title**\n概括本 Item 的核心业务目标。要求：简洁；不得凭空增加原文没有的工作；\n不要求逐字摘录；**不要**把 content 前几十字直接截断当标题；\n**不要**把\"2.\"、\"（3）\"、\"①\"等编号带进标题；\n多动作 Item 要概括主要业务事项，**不要**用\"并\"\"以及\"机械拼接一长串动作。\n\n**content**\n尽可能完整保留该 Item 对应的业务动作。允许标点规范化、去掉排版垃圾、\n删除纯编号噪声、把同一事项的多个动作合并成通顺文本。\n禁止总结掉重要细节、禁止添加原文不存在的任务、\n禁止把不同项目的动作混进同一个 content。\n\n**evidence_text**\n从下面 Block 原文中**逐字复制**该 Item 对应的原文片段，必须与原文完全一致，\n包括其中的\"①\"\"（2）\"等编号符号。不要改写、不要省略中间内容、不要加省略号。\n一个 Item 对应原文连续的一段。程序会用它回原文定位字符位置，\n所以**任何改写都会导致定位失败**。\n\n你**不要**输出 page_start、page_end、start_char、end_char、exact_match，\n这些一律由程序计算。"
        - id: usr
          role: user
          text: '## Block 上下文


            - department: {{#block_fields.department#}}

            - work_section: {{#block_fields.work_section#}}

            - delivery_group: {{#block_fields.delivery_group#}}


            ## Block 原文


            ```

            {{#block_fields.raw_text#}}

            ```'
