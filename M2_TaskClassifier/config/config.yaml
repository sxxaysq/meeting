input:
  m1_json: /home/yty/M1_Preprocess/data/output/clean_segments.json

output:
  classifications: data/output/m2_classifications.json
  audit: data/output/m2_model_audit.json
  review_queue: data/output/m2_review_queue.json

resources:
  output_schema: config/m2_output.schema.json
  system_prompt: prompts/m2_system_prompt.txt

llm:
  # 默认连接本机 OpenAI 兼容 Qwen 服务；EMPTY 不是有效凭据。
  api_key: EMPTY
  base_url: http://127.0.0.1:8000/v1
  model: Qwen/Qwen3.6-35B-A3B
  api_key_env: M2_API_KEY
  base_url_env: M2_BASE_URL
  model_env: M2_MODEL
  temperature: 0.0
  max_tokens: 4096
  structured_output: true

processing:
  context_chars: 300
  repair_attempts: 1
